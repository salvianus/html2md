name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - name: CLI smoke test
        run: |
          echo '<h1>hi</h1>' | node bin/html2md.js | grep -q '# hi'
          curl -s https://example.com | node bin/html2md.js | grep -q 'Example Domain'